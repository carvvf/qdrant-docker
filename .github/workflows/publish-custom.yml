name: Publish custom image
run-name: Publish source-built Qdrant image

on:
  workflow_dispatch:
    inputs:
      qdrant_upstream_ref:
        description: Optional immutable qdrant/qdrant reference; empty resolves latest
        required: false
        default: ''
      qdrant_upstream_version:
        description: Optional Qdrant version; empty resolves the official image label
        required: false
        default: ''
      qdrant_upstream_digest:
        description: Optional official-image manifest digest
        required: false
        default: ''
      qdrant_source_ref:
        description: Optional Qdrant source tag; empty derives v<upstream-version>
        required: false
        default: ''
      qdrant_source_revision:
        description: Optional Qdrant source commit; empty resolves the source tag
        required: false
        default: ''
      ubuntu_base_ref:
        description: Optional immutable Ubuntu runtime reference; empty resolves ubuntu:24.04
        required: false
        default: ''
      ubuntu_base_digest:
        description: Optional Ubuntu manifest digest
        required: false
        default: ''
  workflow_call:
    inputs:
      qdrant_upstream_ref:
        required: false
        type: string
        default: ''
      qdrant_upstream_version:
        required: false
        type: string
        default: ''
      qdrant_upstream_digest:
        required: false
        type: string
        default: ''
      qdrant_source_ref:
        required: false
        type: string
        default: ''
      qdrant_source_revision:
        required: false
        type: string
        default: ''
      ubuntu_base_ref:
        required: false
        type: string
        default: ''
      ubuntu_base_digest:
        required: false
        type: string
        default: ''

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

concurrency:
  group: qdrant-image-publish-${{ github.repository }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      image_ref: ${{ steps.resolve.outputs.image_ref }}
      version: ${{ steps.resolve.outputs.version }}
      upstream_ref: ${{ steps.resolve.outputs.upstream_ref }}
      upstream_version: ${{ steps.resolve.outputs.upstream_version }}
      upstream_digest: ${{ steps.resolve.outputs.upstream_digest }}
      source_ref: ${{ steps.resolve.outputs.source_ref }}
      source_revision: ${{ steps.resolve.outputs.source_revision }}
      ubuntu_base_ref: ${{ steps.resolve.outputs.ubuntu_base_ref }}
      ubuntu_base_digest: ${{ steps.resolve.outputs.ubuntu_base_digest }}

    steps:
      - name: Resolve upstream release, source revision, Ubuntu base, and custom version
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_UPSTREAM_REF: ${{ inputs.qdrant_upstream_ref }}
          INPUT_UPSTREAM_VERSION: ${{ inputs.qdrant_upstream_version }}
          INPUT_UPSTREAM_DIGEST: ${{ inputs.qdrant_upstream_digest }}
          INPUT_SOURCE_REF: ${{ inputs.qdrant_source_ref }}
          INPUT_SOURCE_REVISION: ${{ inputs.qdrant_source_revision }}
          INPUT_UBUNTU_BASE_REF: ${{ inputs.ubuntu_base_ref }}
          INPUT_UBUNTU_BASE_DIGEST: ${{ inputs.ubuntu_base_digest }}
        run: |
          set -euo pipefail

          upstream_ref="${INPUT_UPSTREAM_REF}"
          upstream_version="${INPUT_UPSTREAM_VERSION}"
          upstream_digest="${INPUT_UPSTREAM_DIGEST}"
          if [ -z "${upstream_ref}" ]; then
            docker pull qdrant/qdrant:latest
            upstream_digest="$(docker image inspect qdrant/qdrant:latest --format '{{index .RepoDigests 0}}')"
            upstream_digest="${upstream_digest##*@}"
            upstream_version="$(docker image inspect qdrant/qdrant:latest --format '{{index .Config.Labels "org.opencontainers.image.version"}}')"
            upstream_ref="qdrant/qdrant@${upstream_digest}"
          fi

          if [ -z "${upstream_version}" ] || [ -z "${upstream_digest}" ] || [ "${upstream_digest}" = 'unknown' ]; then
            echo 'An official Qdrant version and immutable manifest digest are required.' >&2
            exit 1
          fi
          if [[ ! "${upstream_digest}" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "Invalid Qdrant manifest digest: ${upstream_digest}" >&2
            exit 1
          fi
          upstream_version="${upstream_version#v}"
          if [[ ! "${upstream_version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z._-]+)?$ ]]; then
            echo "Unsupported Qdrant version format: ${upstream_version}" >&2
            exit 1
          fi

          source_ref="${INPUT_SOURCE_REF:-v${upstream_version}}"
          source_revision_from_tag="$(git ls-remote https://github.com/qdrant/qdrant.git "refs/tags/${source_ref}^{}" | awk 'NR == 1 { print $1 }')"
          if [ -z "${source_revision_from_tag}" ]; then
            source_revision_from_tag="$(git ls-remote https://github.com/qdrant/qdrant.git "refs/tags/${source_ref}" | awk 'NR == 1 { print $1 }')"
          fi
          if [[ ! "${source_revision_from_tag}" =~ ^[a-f0-9]{40}$ ]]; then
            echo "Could not resolve Qdrant source tag: ${source_ref}" >&2
            exit 1
          fi
          source_revision="${INPUT_SOURCE_REVISION:-${source_revision_from_tag}}"
          if [ "${source_revision}" != "${source_revision_from_tag}" ]; then
            echo "Source revision does not match ${source_ref}: ${source_revision}" >&2
            exit 1
          fi

          ubuntu_base_ref="${INPUT_UBUNTU_BASE_REF}"
          ubuntu_base_digest="${INPUT_UBUNTU_BASE_DIGEST}"
          if [ -z "${ubuntu_base_ref}" ]; then
            docker pull ubuntu:24.04
            ubuntu_base_digest="$(docker image inspect ubuntu:24.04 --format '{{index .RepoDigests 0}}')"
            ubuntu_base_digest="${ubuntu_base_digest##*@}"
            ubuntu_base_ref="ubuntu@${ubuntu_base_digest}"
          fi
          if [ -z "${ubuntu_base_digest}" ] || [ "${ubuntu_base_digest}" = 'unknown' ]; then
            echo 'An immutable Ubuntu runtime manifest digest is required.' >&2
            exit 1
          fi
          if [[ ! "${ubuntu_base_digest}" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "Invalid Ubuntu manifest digest: ${ubuntu_base_digest}" >&2
            exit 1
          fi

          owner="${GITHUB_REPOSITORY_OWNER}"
          owner_lc="$(printf '%s' "${owner}" | tr '[:upper:]' '[:lower:]')"
          package_name="$(printf '%s' "${GITHUB_REPOSITORY#*/}" | tr '[:upper:]' '[:lower:]')"
          image_ref="ghcr.io/${owner_lc}/${package_name}"
          escaped_upstream_version="${upstream_version//./\\.}"

          owner_type="$(gh api -H 'Accept: application/vnd.github+json' "/users/${owner}" --jq '.type')"
          if [ "${owner_type}" = 'Organization' ]; then
            package_scope="/orgs/${owner}"
          else
            package_scope="/users/${owner}"
          fi

          latest_n=''
          set +e
          versions_json="$(gh api -H 'Accept: application/vnd.github+json' "${package_scope}/packages/container/${package_name}/versions?per_page=100" 2>/tmp/qdrant-ghcr-versions.err)"
          versions_status=$?
          set -e
          if [ "${versions_status}" -eq 0 ]; then
            latest_n="$(
              jq -r '
                .[]
                | .metadata.container.tags // []
                | select(index("latest"))
                | .[]
              ' <<<"${versions_json}" \
                | sed -nE "s/^${escaped_upstream_version}-custom\\.([0-9]+)$/\\1/p" \
                | sort -n \
                | tail -n1
            )"
          elif grep -q '404' /tmp/qdrant-ghcr-versions.err; then
            echo 'GHCR package does not exist yet; this is the bootstrap publication.'
          else
            cat /tmp/qdrant-ghcr-versions.err >&2
            exit "${versions_status}"
          fi

          if [ -z "${latest_n}" ]; then
            next_n=1
            previous_version='none'
          else
            next_n=$((latest_n + 1))
            previous_version="${upstream_version}-custom.${latest_n}"
          fi
          version="${upstream_version}-custom.${next_n}"

          {
            echo "image_ref=${image_ref}"
            echo "version=${version}"
            echo "upstream_ref=${upstream_ref}"
            echo "upstream_version=${upstream_version}"
            echo "upstream_digest=${upstream_digest}"
            echo "source_ref=${source_ref}"
            echo "source_revision=${source_revision}"
            echo "ubuntu_base_ref=${ubuntu_base_ref}"
            echo "ubuntu_base_digest=${ubuntu_base_digest}"
          } >> "${GITHUB_OUTPUT}"

          {
            echo '## Custom image preflight'
            echo "- Official Qdrant release signal: ${upstream_ref}"
            echo "- Qdrant source: ${source_ref}@${source_revision}"
            echo "- Ubuntu runtime base: ${ubuntu_base_ref}"
            echo "- Previous custom version: ${previous_version}"
            echo "- New custom version: ${version}"
            echo "- Target: ${image_ref}:${version}"
          } >> "${GITHUB_STEP_SUMMARY}"

  build:
    needs: preflight
    uses: ./.github/workflows/build-custom.yml
    with:
      image_tag_suffix: ${{ needs.preflight.outputs.version }}
      qdrant_source_ref: ${{ needs.preflight.outputs.source_ref }}
      qdrant_source_revision: ${{ needs.preflight.outputs.source_revision }}
      qdrant_upstream_version: ${{ needs.preflight.outputs.upstream_version }}
      qdrant_upstream_digest: ${{ needs.preflight.outputs.upstream_digest }}
      ubuntu_base_ref: ${{ needs.preflight.outputs.ubuntu_base_ref }}
      ubuntu_base_digest: ${{ needs.preflight.outputs.ubuntu_base_digest }}
    permissions:
      contents: read

  publish:
    needs:
      - preflight
      - build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.0.0

      - name: Log in to GHCR
        uses: docker/login-action@v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and publish linux/amd64 image
        uses: docker/build-push-action@v7.0.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          pull: true
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=qdrant-source-amd64
          cache-to: type=gha,mode=max,scope=qdrant-source-amd64
          tags: |
            ${{ needs.preflight.outputs.image_ref }}:${{ needs.preflight.outputs.version }}
            ${{ needs.preflight.outputs.image_ref }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.preflight.outputs.version }}
            io.github.carvvf.qdrant-docker.qdrant.source.ref=${{ needs.preflight.outputs.source_ref }}
            io.github.carvvf.qdrant-docker.qdrant.source.revision=${{ needs.preflight.outputs.source_revision }}
            io.github.carvvf.qdrant-docker.qdrant.upstream.digest=${{ needs.preflight.outputs.upstream_digest }}
            io.github.carvvf.qdrant-docker.runtime.base.name=ubuntu:24.04
            io.github.carvvf.qdrant-docker.runtime.base.digest=${{ needs.preflight.outputs.ubuntu_base_digest }}
          build-args: |
            QDRANT_SOURCE_REF=${{ needs.preflight.outputs.source_ref }}
            QDRANT_SOURCE_REVISION=${{ needs.preflight.outputs.source_revision }}
            QDRANT_UPSTREAM_VERSION=${{ needs.preflight.outputs.upstream_version }}
            QDRANT_UPSTREAM_DIGEST=${{ needs.preflight.outputs.upstream_digest }}
            UBUNTU_BASE_IMAGE=${{ needs.preflight.outputs.ubuntu_base_ref }}
            UBUNTU_BASE_DIGEST=${{ needs.preflight.outputs.ubuntu_base_digest }}
            SOURCE_REPOSITORY=https://github.com/${{ github.repository }}
            CACHEBUST=${{ github.run_id }}

      - name: Verify the published linux/amd64 manifest
        run: |
          set -euo pipefail
          image='${{ needs.preflight.outputs.image_ref }}:${{ needs.preflight.outputs.version }}'
          docker buildx imagetools inspect "${image}"
          # Excludes non-platform entries such as the provenance/SBOM
          # attestation manifest that buildx attaches to the index.
          docker buildx imagetools inspect --raw "${image}" \
            | jq -e '
                [.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64")]
                | length == 1
              ' >/dev/null

      - name: Publish summary
        run: |
          {
            echo '## Publish result'
            echo '- Published platform: linux/amd64'
            echo '- Published image: ${{ needs.preflight.outputs.image_ref }}:${{ needs.preflight.outputs.version }}'
            echo '- Mutable tag: ${{ needs.preflight.outputs.image_ref }}:latest'
            echo '- Qdrant source: ${{ needs.preflight.outputs.source_ref }}@${{ needs.preflight.outputs.source_revision }}'
            echo '- Ubuntu base: ${{ needs.preflight.outputs.ubuntu_base_ref }}'
          } >> "${GITHUB_STEP_SUMMARY}"
